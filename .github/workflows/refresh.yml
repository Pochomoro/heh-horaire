name: Refresh horaire

on:
  schedule:
    - cron: "15 4 * * *"   # chaque jour vers 5h-6h (heure belge)
  workflow_dispatch:        # bouton "Run workflow" pour forcer un refresh
  push:
    branches: [main]
    paths: [fetch.py, template.html]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch.py
      # Un commit par jour (l'heure de mise à jour change) : GitHub Pages
      # republie la page, et l'activité empêche GitHub de couper le cron
      # après 60 jours d'inactivité.
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html horaire.ics horaire.json
          git diff --cached --quiet || git commit -m "Refresh horaire $(date -u +%F)"
          git push
